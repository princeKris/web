<div class="not-found-page d-flex flex-column justify-content-center align-items-center text-center p-4">
  <h1 class="display-1 fw-bold mb-3">404</h1>
  <p class="lead mb-4">Oops — the page you are looking for doesn't exist.</p>

  <div class="mb-3">
    <button class="btn btn-primary me-2" (click)="goHome()">Go to Home</button>

</div>
